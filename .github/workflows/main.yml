name: Build StarfallNuke JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Mod JAR
        run: gradle build
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: StarfallNuke-1.0.0-Forge
          path: build/libs/*.jar
